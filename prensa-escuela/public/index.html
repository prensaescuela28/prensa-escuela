<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prensa Escuela</title>
<meta name="description" content="Noticias y columnas de opinión escritas por el equipo de prensa del colegio.">
<link rel="icon" type="image/png" href="/escudo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="masthead">
  <img class="masthead-crest" src="/escudo.png" alt="Escudo de la Escuela Normal Superior de Manatí">
  <div class="masthead-edition" id="edition-date">EDICIÓN DIGITAL</div>
  <h1 class="masthead-title">Prensa Escuela</h1>
  <div class="masthead-rule"></div>
  <div class="masthead-actions">
    <a class="masthead-admin-link" href="/admin.html">Publicar una noticia →</a>
  </div>
</header>

<main class="front-page">
  <div id="status" class="front-page-status">Cargando la edición de hoy…</div>
  <div id="grid" class="grid" hidden></div>
</main>

<script>
  document.getElementById('edition-date').textContent =
    'EDICIÓN DIGITAL · ' + new Date().toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' });

  async function loadArticles() {
    const statusEl = document.getElementById('status');
    const gridEl = document.getElementById('grid');
    try {
      const res = await fetch('/api/articles');
      if (!res.ok) throw new Error('respuesta no válida');
      const articles = await res.json();

      if (!articles.length) {
        statusEl.innerHTML = 'Todavía no hay noticias publicadas. <br>El equipo de prensa puede <a href="/admin.html">publicar la primera</a>.';
        return;
      }

      statusEl.hidden = true;
      gridEl.hidden = false;
      gridEl.innerHTML = articles.map(renderCard).join('');
    } catch (err) {
      statusEl.innerHTML = '<strong>No se pudo cargar la edición.</strong><br>Actualiza la página o inténtalo de nuevo en un momento.';
    }
  }

  function renderCard(a) {
    const tagClass = a.category === 'Columna de Opinión' ? 'tag--opinion' : 'tag--noticia';
    const date = new Date(a.publishedAt).toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' });
    const image = a.hasImage
      ? `<img class="card-image" src="/api/image?slug=${a.slug}" alt="${escapeHtml(a.title)}">`
      : `<div class="card-image card-image--placeholder">SIN FOTO</div>`;
    return `
      <a class="card" href="/noticia/${a.slug}">
        ${image}
        <span class="tag ${tagClass}">${escapeHtml(a.category)}</span>
        <h2 class="card-title">${escapeHtml(a.title)}</h2>
        <p class="card-excerpt">${escapeHtml(a.excerpt)}</p>
        <p class="card-byline">Por ${escapeHtml(a.author)} · ${date}</p>
      </a>`;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  loadArticles();
</script>
</body>
</html>
