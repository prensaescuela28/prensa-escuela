<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historia territorial — Prensa Normalista</title><link rel="icon" href="/escudo.png"><link rel="stylesheet" href="/styles.css"></head><body><header class="masthead"><a href="/territorio.html" class="masthead-link"><img class="masthead-crest" src="/escudo.png" alt="Escudo"><div class="masthead-edition">MEMORIA Y TERRITORIO</div><h1 class="masthead-title">Identidad territorial</h1><p class="masthead-subtitle">Historias, lugares y voces de nuestra comunidad</p><div class="masthead-rule"></div></a><nav class="main-nav"><a href="/">Inicio</a><a href="/laboratorio.html">Laboratorio</a><a href="/territorio.html">Territorio</a><a href="/encuestas.html">Encuestas</a><a href="/voces.html">Muchas voces</a></nav></header><main class="article-page" id="story"><p class="empty-state">Cargando historia…</p></main><footer class="site-footer"><strong>Prensa Normalista</strong><span>Identidad territorial</span></footer><script>const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const paras=s=>esc(s).split(/
\s*
/).map(p=>`<p>${p.replace(/
/g,'<br>')}</p>`).join('');const ve=u=>{const m=String(u||'').match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{6,})/);return m?'https://www.youtube.com/embed/'+m[1]:''};async function load(){const id=new URLSearchParams(location.search).get('id');if(!id)return document.getElementById('story').innerHTML='<p class="message message--error">Historia no encontrada.</p>';const r=await fetch('/api/territory?id='+encodeURIComponent(id));const x=await r.json();if(!r.ok)return document.getElementById('story').innerHTML='<p class="message message--error">Esta historia no existe o fue retirada.</p>';document.title=x.title+' — Prensa Normalista';document.getElementById('story').innerHTML=`<article class="article-view"><span class="kicker">${esc(x.category)}</span><h1>${esc(x.title)}</h1><p class="published-meta">📍 ${esc(x.place)} · ${esc(x.author)}</p>${x.hasImage?`<img class="article-hero-image" src="/api/territory-media?id=${encodeURIComponent(x.id)}" alt="${esc(x.title)}">`:''}<div class="article-content">${paras(x.content)}</div>${x.videoUrl?`<div class="media-box"><h3>🎥 Video</h3><div class="video-wrap"><iframe src="${ve(x.videoUrl)}" title="Video relacionado" allowfullscreen loading="lazy"></iframe></div></div>`:''}${x.audioUrl?`<div class="media-box"><h3>🎙️ Audio / podcast</h3><audio controls preload="none" src="${esc(x.audioUrl)}"></audio></div>`:''}<div class="share-box"><strong>Comparte esta historia</strong><div class="share-actions"><a class="share-btn share-whatsapp" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(x.title+' — '+location.href)}">WhatsApp</a><button class="share-btn" onclick="navigator.clipboard.writeText(location.href).then(()=>this.textContent='¡Enlace copiado!')">Copiar enlace</button></div></div></article>`}load();</script></body></html>
