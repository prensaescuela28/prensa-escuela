<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Una pregunta, muchas voces — Prensa Normalista</title><link rel="icon" href="/escudo.png"><link rel="stylesheet" href="/styles.css"></head><body><header class="masthead"><a href="/" class="masthead-link"><img class="masthead-crest" src="/escudo.png" alt="Escudo"><div class="masthead-edition">ESPECIAL</div><h1 class="masthead-title">Una pregunta, muchas voces</h1><p class="masthead-subtitle">Una misma pregunta, distintas miradas</p><div class="masthead-rule"></div></a><nav class="main-nav"><a href="/">Inicio</a><a href="/laboratorio.html">Laboratorio</a><a href="/territorio.html">Territorio</a><a href="/encuestas.html">Encuestas</a><a href="/voces.html">Muchas voces</a></nav></header><main class="form-page"><section id="question-hero" class="question-hero"></section><div id="voices-grid" class="many-voices-grid"></div></main><footer class="site-footer"><strong>Prensa Normalista</strong><span>Una pregunta, muchas voces</span></footer><script>async function load(){const r=await fetch('/api/questions'),q=await r.json();document.getElementById('question-hero').innerHTML=q.question?`<span class="kicker">LA PREGUNTA</span><h2>“${esc(q.question)}”</h2><p>${esc(q.intro||'Conoce distintas perspectivas de nuestra comunidad educativa.')}</p>`:'<p class="empty-state">Próximamente presentaremos una nueva pregunta.</p>';document.getElementById('voices-grid').innerHTML=(q.voices||[]).map(v=>`<article class="voice-perspective"><span class="avatar">${initials(v.name)}</span><h3>${esc(v.name)}</h3><small>${esc(v.role)}</small><p>“${esc(v.answer)}”</p></article>`).join('')||''}function initials(s){return String(s||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}load();</script></body></html>
